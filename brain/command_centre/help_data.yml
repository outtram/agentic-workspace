# Single source of truth for all Command Centre help text.
# Generated outputs: HELP.md, _HELP_TEXT in app.py, /help in router.py
# Run: python3 -m brain.command_centre.help_gen

terminal_commands:
  - cmd: "cc"
    desc: "Command Centre TUI — 3x3 tile grid with multi-select, today list, pagination"
  - cmd: "outbot"
    desc: "OutBot text chat (Opus 4.6)"
  - cmd: "outbot voice"
    desc: "OutBot voice chat"
  - cmd: "outbot sonnet"
    desc: "OutBot using Sonnet (cheaper)"
  - cmd: "outbot haiku"
    desc: "OutBot using Haiku (cheapest)"
  - cmd: "outbot opus"
    desc: "OutBot using Opus (explicit)"
  - cmd: "outbot test"
    desc: "Run OutBot diagnostics"
  - cmd: "outbot debug"
    desc: "OutBot with debug logging"
  - cmd: "claude"
    desc: "Claude Code CLI"
  - cmd: "cursor-agent"
    desc: "Cursor agent CLI"

grid_view_keys:
  navigation:
    - key: "Arrow keys"
      action: "Move focus between tiles"
    - key: "Enter"
      action: "Drill down — parent task → show children; leaf task → open Focus View"
    - key: "Space"
      action: "Toggle select on focused tile"
    - key: "1-9"
      action: "Jump to tile by position"
    - key: "[ / ]"
      action: "Page left / right"

  selection:
    - key: "a"
      action: "Select all on page"
    - key: "n"
      action: "Deselect all"

  actions:
    - key: "/"
      action: "Command Palette — all commands, agents, and skills in a filterable list"
    - key: "c"
      action: "Toggle chat panel (talk to OutBot)"
    - key: "t"
      action: "Add selected (or focused) to today"
    - key: "d"
      action: "Mark done (local + iOS)"
    - key: "e"
      action: "Edit focused task (modal)"
    - key: "v"
      action: "Toggle voice mode"
    - key: ":"
      action: "Filter mode (:q1, :overdue, :today, :search)"
    - key: "?"
      action: "Show help overlay"
    - key: "Escape"
      action: "Back one level → clear filter → clear selection → double-tap to quit"

focus_view_keys:
  - key: "↑ / ↓"
    action: "Navigate between fields"
  - key: "Enter"
    action: "Edit field (text input) or cycle choice (quadrant/priority/status)"
  - key: "Escape"
    action: "Stop editing → back to field list → back to grid"
  - key: "/"
    action: "Command Palette for this task (agents, skills, commands)"
  - key: "c"
    action: "Toggle chat panel"
  - key: "n"
    action: "Add a timestamped note"
  - key: "p"
    action: "Open/create PRD (editable, Esc saves, includes research)"
  - key: "t"
    action: "Add to today"
  - key: "d"
    action: "Mark done"
  - key: "Space"
    action: "Toggle select"

command_palette_keys:
  - key: "↑ / ↓"
    action: "Navigate between items"
  - key: "Enter"
    action: "Select item"
  - key: "Type"
    action: "Filter items"
  - key: "Escape"
    action: "Close palette"

voice_mode_keys:
  - key: "Enter"
    action: "Start / stop recording"
  - key: "v"
    action: "Turn voice off"
  - key: "Escape"
    action: "Cancel current recording"

cc_slash_commands:
  - cmd: "/done"
    desc: "Mark selected tasks done (local + iOS + git)"
  - cmd: "/today"
    desc: "Add selected to today list"
  - cmd: "/remove"
    desc: "Remove selected from today list"
  - cmd: "/q1 .. /q4"
    desc: "Move selected to Eisenhower quadrant"
  - cmd: "/enrich"
    desc: "Improve task descriptions via Claude"
  - cmd: "/research"
    desc: "Fetch URLs from tasks + summarise findings via Claude"
  - cmd: "/daily"
    desc: "Run daily review (reminders + email + dashboard)"
    aliases: ["/dailyreview", "/daily-review"]
  - cmd: "/inbox"
    desc: "Check email inbox (Gmail)"
  - cmd: "/import"
    desc: "Import unread emails as tasks (syncs to iOS)"
    aliases: ["/import-emails"]
  - cmd: "/email <msg>"
    desc: "Send an email via OutBot (Claude extracts details)"
  - cmd: "/agent"
    desc: "List available agents (or /agent <name> for details)"
  - cmd: "/skill"
    desc: "List available skills (or /skill <name> for details)"
  - cmd: "/remember <text>"
    desc: "Save a memory (shared with OutBot)"
  - cmd: "/forget <text>"
    desc: "Remove a stored memory"
  - cmd: "/telegram <msg>"
    desc: "Send a Telegram message"
  - cmd: "/arch"
    desc: "Open architecture diagram in browser"
  - cmd: "/help"
    desc: "Show available commands"

predictions:
  desc: "On launch, the brain analyses brain-log.yml for day-of-week patterns, frequently selected tasks, and unfinished tasks from yesterday. If suggestions are found, the context panel shows \"Brain suggests\" with y to accept (adds to today) or n to dismiss."

