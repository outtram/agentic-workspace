reminders_cli_commands:
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli sync --quick"
    desc: "Pull recent reminders from iOS (fast, last 24h)"
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli sync"
    desc: "Full sync — pull all reminders from iOS (slow)"
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli list"
    desc: "List all active reminders"
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli show OUT-XXX"
    desc: "Show detailed info for a task"
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli add \"title\""
    desc: "Create a new reminder (syncs to iOS)"
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli complete OUT-XXX"
    desc: "Mark a task as done (syncs to iOS)"
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli delete OUT-XXX"
    desc: "Delete a reminder from both systems"
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli enrich OUT-XXX"
    desc: "Make a vague task more actionable with AI"
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli nudge"
    desc: "Check for overdue and urgent tasks"
  - cmd: "cd .claude/reminders && python3 -m reminders.plugins.cli progress"
    desc: "Help complete the next step of a task"

