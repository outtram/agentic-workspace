name: 808-trap
description: Trap beat — rolling hats, booming 808, clap on 3
category: drums
genre: trap
bpm_range: [130, 150]
code: |
  d1 $ s "eight0eight ~ ~ ~ ~ ~ eight0eight ~" # gain 1.3 # decay 2 # freq 45
  d2 $ s "~ ~ ~ ~ eightclap ~ ~ ~" # gain 0.9
  d3 $ fast 2 $ s "eightch eightch eightch [eightch eightch eightch]" # gain 0.5
  d4 $ s "~ ~ ~ ~ ~ ~ ~ eightoh" # gain 0.6
tags: [808, trap, rolling-hats, heavy-kick]
