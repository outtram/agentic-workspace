[project]
name = "outbot-brain"
version = "0.1.0"
description = "OutBot: Troy's proactive AI assistant"
requires-python = ">=3.11"
dependencies = [
    "croniter>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
voice = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "tui: Command Centre TUI widget tests (Textual Pilot)",
    "handler: Command Centre handler integration tests",
    "integration: cross-module integration tests",
    "e2e: end-to-end Pilot user flow tests",
    "snapshot: pytest-textual-snapshot visual regression tests",
    "slow: tests that call Claude CLI (slow, require Max plan)",
]
