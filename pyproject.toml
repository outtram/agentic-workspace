[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E4/E7/E9: critical syntax/import/runtime errors; F: pyflakes (undefined names, unused imports)
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F401",  # imported but unused — common in __init__.py re-exports
    "F841",  # local variable assigned but never used — acceptable in existing code
    "E402",  # module import not at top — intentional in some modules (path setup)
    "E731",  # lambda assignment — stylistic, not an error
    "E741",  # ambiguous variable name — case-by-case acceptable
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "tui: Command Centre TUI widget tests (Textual Pilot)",
    "handler: Command Centre handler integration tests",
    "integration: cross-module integration tests",
    "e2e: end-to-end Pilot user flow tests",
    "snapshot: pytest-textual-snapshot visual regression tests",
    "slow: tests that take >5s (network, model loading)",
]
